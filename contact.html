

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMW</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: white;
            color: #111;
        }

        header {
            width: 100%;
            min-height: 100px;
            background-color: lightblue;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 0 50px;
        }

        .logo {
    width: 50px;
    height: 50px;
    object-fit: contain;
    position: absolute;
    left: 20px;
    top: 50%;
    transform: translateY(-50%);
}

        header h1 {
            color: black;
            font-size: 32px;
        }

        nav {
            display: flex;
            align-items: center;
            gap: 25px;
            position: absolute;
            right: 50px;
        }

        nav a {
            color: black;
            text-decoration: none;
            font-size: 18px;
            padding: 10px 15px;
        }

        nav a:hover {
            background-color: white;
            border-radius: 5px;
        }

        .title {
            text-align: center;
            margin-top: 35px;
        }

        .title h2 {
            font-size: 30px;
        }

        .pictures {
            width: 100%;
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: 30px;
            margin-top: 35px;
            padding: 0 20px;
        }

        .pictures img {
            width: 48%;
            height: 400px;
            object-fit: cover;
            display: block;
        }

        .third-picture {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-top: 30px;
            padding: 0 20px;
        }

        .third-picture img {
            width: 70%;
            height: 400px;
            object-fit: cover;
            display: block;
        }

        footer {
            width: 100%;
            background-color: lightblue;
            color: black;
            text-align: center;
            padding: 25px;
            margin-top: 40px;
        }

        @media (max-width: 1024px) {

            header {
                padding: 0 30px;
            }

            header h1 {
                font-size: 28px;
            }

            nav {
                right: 30px;
                gap: 10px;
            }

            nav a {
                font-size: 16px;
                padding: 8px 10px;
            }

            .pictures {
                gap: 20px;
                padding: 0 20px;
            }

            .pictures img {
                width: 48%;
                height: 350px;
            }

            .third-picture img {
                width: 80%;
                height: 350px;
            }
        }

        @media (max-width: 768px) {

            header {
                min-height: 90px;
                padding: 15px 20px;
            }

            header h1 {
                font-size: 24px;
            }

            nav {
                right: 20px;
                gap: 5px;
            }

            nav a {
                font-size: 14px;
                padding: 7px 5px;
            }

            .title {
                margin-top: 25px;
            }

            .title h2 {
                font-size: 24px;
            }

            .pictures {
                flex-direction: row;
                gap: 10px;
                padding: 0 10px;
            }

            .pictures img {
                width: 48%;
                height: 250px;
            }

            .third-picture {
                padding: 0 10px;
            }

            .third-picture img {
                width: 100%;
                height: 250px;
            }


        }

        @media (max-width: 600px) {

            header {
                min-height: auto;
                padding: 20px 10px;
                flex-direction: column;
                gap: 15px;
            }

            header h1 {
                font-size: 24px;
            }

            nav {
                position: static;
                display: flex;
                justify-content: center;
                gap: 5px;
            }

            nav a {
                font-size: 14px;
                padding: 7px 8px;
            }

            .title {
                margin-top: 25px;
                padding: 0 10px;
            }

            .title h2 {
                font-size: 21px;
            }

            .pictures {
                flex-direction: column;
                gap: 20px;
                padding: 0 15px;
            }

            .pictures img {
                width: 100%;
                height: 250px;
            }

            .third-picture {
                padding: 0 15px;
            }

            .third-picture img {
                width: 100%;
                height: 250px;
            }

            footer {
                margin-top: 30px;
                padding: 20px;
            }
        }

        @media (max-width: 480px) {

            header {
                padding: 15px 5px;
            }

            header h1 {
                font-size: 22px;
            }

            nav {
                gap: 0;
            }

            nav a {
                font-size: 12px;
                padding: 6px 7px;
            }

            .title h2 {
                font-size: 19px;
            }

            .pictures {
                padding: 0 10px;
                gap: 15px;
            }

            .pictures img {
                width: 100%;
                height: 200px;
            }

            .third-picture {
                padding: 0 10px;
            }

            .third-picture img {
                width: 100%;
                height: 200px;
            }

            footer {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

    <header>

        <img src="logo.png" alt="BMW Logo" class="logo">

        <h1>THIS IS WHERE YOU CAN GET US</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </nav>

    </header>

    <div class="title">
        <h2 style="background-color: lightblue;">2222546720/+2890178234</h2>
    </div>

    <div class="pictures">

        <img src="dream.jpg" alt="BMW">

        <img src="zile.jpg" alt="BMW">

    </div>

    <div class="third-picture">

        <img src="X7.jpg" alt="BMW X7">

    </div>

    <footer>
        bmw@yahoo
    </footer>

</body>

</html>
